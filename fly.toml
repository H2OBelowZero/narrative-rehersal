# Fly.io: one machine runs the rehearsal server, which also serves the web app (see Dockerfile).
# The story store is a JSON file in memory + on disk, so it runs as exactly ONE machine with a volume at /data.

app = 'narrative-rehersal'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'
  DATA_DIR = '/data'

[[mounts]]
  source = 'story_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  # Stopping is safe (the store flushes on SIGTERM and reloads from the volume); open WebSockets keep it awake.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
